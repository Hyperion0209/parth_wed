<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parth & Sai — Sangeet Night</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Cormorant Garamond', serif; color: #f0e8d0; }

    /* ── SLIDE SYSTEM ── */
    #stage { width: 100vw; height: 100vh; position: relative; }
    .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0s; overflow: hidden; }
    .slide.active { opacity: 1; pointer-events: all; }
    .slide.entering { animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .slide.entering.back { animation: slideInBack 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .slide.leaving { animation: slideOut 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
    .slide.leaving.back { animation: slideOutBack 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }

    @keyframes slideIn { from { opacity: 0; transform: translateY(40px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideInBack { from { opacity: 0; transform: translateY(-40px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-30px) scale(1.01); } }
    @keyframes slideOutBack { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(30px) scale(1.01); } }

    /* ── CANVAS LAYERS ── */
    #global-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .slide-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .bg-image { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
    .bg-overlay { position: absolute; inset: 0; z-index: 1; }

    /* ── PHOTO CAROUSEL ── */
    .photo-carousel { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .photo-carousel img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease; position: absolute; }
    .photo-carousel img.active { opacity: 1; }
    .carousel-nav { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; }
    .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(201, 168, 76, 0.4); cursor: pointer; transition: all 0.3s; border: 1px solid rgba(201, 168, 76, 0.6); }
    .carousel-dot.active { background: #c9a84c; width: 28px; border-radius: 5px; }

    /* ── TYPOGRAPHY ── */
    .hero-title { font-family: 'Cinzel', serif; font-size: clamp(48px, 8vw, 100px); font-weight: 700; color: #f0d080; text-align: center; line-height: 1.1; }
    .hero-subtitle { font-family: 'Cormorant Garamond', serif; font-size: clamp(24px, 4vw, 48px); color: #a89050; text-align: center; margin-top: 20px; font-style: italic; }
    .slide-title { font-family: 'Cinzel', serif; font-size: clamp(52px, 7vw, 96px); font-weight: 700; color: #f0e8d0; text-align: center; }
    .glitch { position: relative; text-shadow: 2px 2px 0px rgba(201, 168, 76, 0.5), -2px -2px 0px rgba(240, 208, 128, 0.5); }
    .shimmer { background: linear-gradient(90deg, #c9a84c, #f0d080, #c9a84c); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 3s linear infinite; }

    @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

    /* ── NAV ── */
    #nav-dots { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 8000; display: flex; gap: 10px; }
    .ndot { width: 8px; height: 8px; border-radius: 50%; background: rgba(201, 168, 76, 0.25); cursor: pointer; transition: all 0.3s; }
    .ndot.active { background: #c9a84c; width: 32px; border-radius: 4px; }
    #slide-counter { position: fixed; top: 28px; right: 40px; z-index: 8000; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 3px; color: #c9a84c; }

    /* ── ANIMATIONS ── */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(201, 168, 76, 0.5)); } 50% { filter: drop-shadow(0 0 25px rgba(240, 208, 128, 0.8)); } }

    .fade-in-up { animation: fadeInUp 0.8s ease forwards; }
    .float { animation: float 3s ease-in-out infinite; }
    .glow { animation: glow 2s ease-in-out infinite; }
  </style>
</head>
<body>

<canvas id="global-canvas"></canvas>
<div id="nav-dots"></div>
<div id="slide-counter">01 / 08</div>

<div id="stage">
  <!-- PAGE 1: HERO -->
  <div class="slide active" data-slide="0">
    <canvas class="slide-canvas" id="canvas-hero"></canvas>
    <div style="position: relative; z-index: 5; text-align: center;">
      <h1 class="hero-title fade-in-up" style="animation-delay: 0.2s;">Parth</h1>
      <div style="font-family: 'Dancing Script', cursive; font-size: clamp(36px, 5vw, 72px); color: #c9a84c; margin: 10px 0;">& </div>
      <h1 class="hero-title fade-in-up" style="animation-delay: 0.4s;">Sai</h1>
      <p class="hero-subtitle fade-in-up" style="animation-delay: 0.6s;">Sangeet Night</p>
    </div>
  </div>

  <!-- PAGE 2: GANESH VANDANA -->
  <div class="slide" data-slide="1">
    <canvas class="slide-canvas" id="canvas-ganesh"></canvas>
  </div>

  <!-- PAGE 3: GROOM SLIDESHOW -->
  <div class="slide" data-slide="2">
    <div class="photo-carousel" id="groom-carousel">
      <img src="groom/1.jpeg" class="active" alt="Parth">
      <img src="groom/2.jpeg" alt="Parth">
      <img src="groom/3.jpeg" alt="Parth">
      <img src="groom/4.jpeg" alt="Parth">
      <img src="groom/5.jpeg" alt="Parth">
      <img src="groom/6.jpeg" alt="Parth">
      <div class="carousel-nav" id="groom-nav"></div>
    </div>
    <div style="position: absolute; bottom: 80px; left: 0; right: 0; z-index: 10; text-align: center;">
      <h2 class="slide-title">Parth Jagtap</h2>
    </div>
  </div>

  <!-- PAGE 4: BRIDE SLIDESHOW -->
  <div class="slide" data-slide="3">
    <div class="photo-carousel" id="bride-carousel">
      <img src="bride/1.jpeg" class="active" alt="Sai">
      <img src="bride/2.jpeg" alt="Sai">
      <img src="bride/3.jpeg" alt="Sai">
      <img src="bride/4.jpeg" alt="Sai">
      <img src="bride/5.jpeg" alt="Sai">
      <img src="bride/6.jpeg" alt="Sai">
      <div class="carousel-nav" id="bride-nav"></div>
    </div>
    <div style="position: absolute; bottom: 80px; left: 0; right: 0; z-index: 10; text-align: center;">
      <h2 class="slide-title">Sai Sawant</h2>
    </div>
  </div>

  <!-- PAGE 5: MELLOW WHITE & GOLD DANCE BACKDROP -->
  <div class="slide" data-slide="4">
    <canvas class="slide-canvas" id="canvas-dance-1"></canvas>
  </div>

  <!-- PAGE 6: JAZZY BOLLYWOOD GLITTER BACKDROP -->
  <div class="slide" data-slide="5">
    <canvas class="slide-canvas" id="canvas-dance-2"></canvas>
  </div>

  <!-- PAGE 7: BEAUTIFUL GRAPHIC -->
  <div class="slide" data-slide="6">
    <canvas class="slide-canvas" id="canvas-graphic"></canvas>
  </div>

  <!-- PAGE 8: GENERIC PARTH & SAI IMAGE -->
  <div class="slide" data-slide="7">
    <img src="generic_parth_sai_bg.png" style="width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;">
  </div>
</div>

<script>
  // ═══════════════════════════════════════════════════════
  // SLIDE MANAGEMENT
  // ═══════════════════════════════════════════════════════
  let currentSlide = 0;
  const slides = document.querySelectorAll('.slide');
  const totalSlides = slides.length;

  function goToSlide(n) {
    slides[currentSlide].classList.remove('active', 'entering', 'leaving');
    slides[n].classList.add('active', 'entering');
    currentSlide = n;
    updateNav();
    initCanvasFX(n);
    document.getElementById('slide-counter').textContent = String(n + 1).padStart(2, '0') + ' / ' + String(totalSlides).padStart(2, '0');
  }

  function nextSlide() {
    slides[currentSlide].classList.add('leaving');
    const next = (currentSlide + 1) % totalSlides;
    goToSlide(next);
  }

  function prevSlide() {
    slides[currentSlide].classList.add('leaving', 'back');
    const prev = (currentSlide - 1 + totalSlides) % totalSlides;
    goToSlide(prev);
  }

  function updateNav() {
    document.querySelectorAll('.ndot').forEach((dot, i) => {
      dot.classList.toggle('active', i === currentSlide);
    });
  }

  // Create nav dots
  const navContainer = document.getElementById('nav-dots');
  for (let i = 0; i < totalSlides; i++) {
    const dot = document.createElement('div');
    dot.className = 'ndot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToSlide(i);
    navContainer.appendChild(dot);
  }

  // ═══════════════════════════════════════════════════════
  // CAROUSEL SYSTEM
  // ═══════════════════════════════════════════════════════
  function initCarousel(carouselId, navId, autoRotate = true) {
    const carousel = document.getElementById(carouselId);
    const images = carousel.querySelectorAll('img:not(.carousel-nav)');
    const nav = document.getElementById(navId);
    let currentIndex = 0;

    // Create dots
    images.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => showImage(i);
      nav.appendChild(dot);
    });

    function showImage(index) {
      images.forEach(img => img.classList.remove('active'));
      document.querySelectorAll(`#${navId} .carousel-dot`).forEach(d => d.classList.remove('active'));
      images[index].classList.add('active');
      document.querySelectorAll(`#${navId} .carousel-dot`)[index].classList.add('active');
      currentIndex = index;
    }

    if (autoRotate && images.length > 0) {
      setInterval(() => {
        showImage((currentIndex + 1) % images.length);
      }, 4000);
    }
  }

  // ═══════════════════════════════════════════════════════
  // CANVAS VISUAL EFFECTS
  // ═══════════════════════════════════════════════════════
  function initCanvasFX(slideIndex) {
    if (slideIndex === 0) drawHeroCanvas();
    else if (slideIndex === 1) drawGaneshCanvas();
    else if (slideIndex === 4) drawDanceBackdrop1();
    else if (slideIndex === 5) drawDanceBackdrop2();
    else if (slideIndex === 6) drawGraphicCanvas();
  }

  function drawHeroCanvas() {
    const canvas = document.getElementById('canvas-hero');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let time = 0;
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#0a0a0f');
      gradient.addColorStop(0.5, '#1a1520');
      gradient.addColorStop(1, '#0a0a0f');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Animated particles
      ctx.fillStyle = 'rgba(201, 168, 76, 0.1)';
      for (let i = 0; i < 50; i++) {
        const x = (Math.sin(time * 0.001 + i) * canvas.width * 0.3 + canvas.width * 0.5);
        const y = (Math.cos(time * 0.0008 + i * 0.5) * canvas.height * 0.3 + canvas.height * 0.5);
        const size = Math.sin(time * 0.002 + i) * 2 + 3;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Gold glitter
      ctx.fillStyle = 'rgba(240, 208, 128, 0.3)';
      for (let i = 0; i < 30; i++) {
        const x = (i * 150 + time * 0.1) % canvas.width;
        const y = Math.sin(x * 0.01 + time * 0.001) * 100 + canvas.height * 0.5;
        ctx.fillRect(x, y, 2, 2);
      }

      time++;
      requestAnimationFrame(animate);
    }
    animate();
  }

  function drawGaneshCanvas() {
    const canvas = document.getElementById('canvas-ganesh');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Fetch and display Ganesh image
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = 'https://images.unsplash.com/photo-1599846875957-fef7b41f36c5?w=1200&h=800&fit=crop'; // Beautiful Ganesh with diyas

    img.onload = function() {
      function animate() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw image centered with slight zoom animation
        const scale = 0.9 + Math.sin(Date.now() * 0.0005) * 0.05;
        const w = img.width * scale;
        const h = img.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;

        ctx.drawImage(img, x, y, w, h);

        // Add glow effect
        ctx.shadowColor = 'rgba(201, 168, 76, 0.3)';
        ctx.shadowBlur = 40;

        requestAnimationFrame(animate);
      }
      animate();
    };
  }

  function drawDanceBackdrop1() {
    const canvas = document.getElementById('canvas-dance-1');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let time = 0;
    function animate() {
      // Mellow white and gold gradient
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#f5f0e8');
      gradient.addColorStop(0.5, '#faf8f3');
      gradient.addColorStop(1, '#f0e8d0');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Soft gold accents
      ctx.fillStyle = `rgba(201, 168, 76, ${0.08 + Math.sin(time * 0.003) * 0.04})`;
      for (let i = 0; i < 15; i++) {
        const x = (Math.sin(time * 0.0002 + i) * canvas.width * 0.4 + canvas.width * 0.5);
        const y = (Math.cos(time * 0.00015 + i * 0.7) * canvas.height * 0.4 + canvas.height * 0.5);
        ctx.beginPath();
        ctx.arc(x, y, 60 + Math.sin(time * 0.002 + i) * 20, 0, Math.PI * 2);
        ctx.fill();
      }

      time++;
      requestAnimationFrame(animate);
    }
    animate();
  }

  function drawDanceBackdrop2() {
    const canvas = document.getElementById('canvas-dance-2');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let time = 0;
    function animate() {
      // Dark background for glitter
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Jazzy neon colors
      const colors = ['#ff006e', '#8338ec', '#3a86ff', '#fb5607', '#ffbe0b'];

      // Animated geometric shapes
      for (let i = 0; i < 40; i++) {
        const angle = (time * 0.01 + i * 0.16) % (Math.PI * 2);
        const radius = 150 + Math.sin(time * 0.002 + i) * 80;
        const x = canvas.width * 0.5 + Math.cos(angle) * radius;
        const y = canvas.height * 0.5 + Math.sin(angle) * radius;

        ctx.fillStyle = colors[i % colors.length];
        ctx.globalAlpha = 0.3 + Math.sin(time * 0.005 + i) * 0.2;
        ctx.beginPath();
        ctx.arc(x, y, 15 + Math.sin(time * 0.003 + i) * 8, 0, Math.PI * 2);
        ctx.fill();
      }

      // Glitter particles
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = '#ffbe0b';
      for (let i = 0; i < 100; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const size = Math.sin(time * 0.01 + i * 0.1) * 2 + 2;
        ctx.fillRect(x, y, size, size);
      }

      ctx.globalAlpha = 1;
      time++;
      requestAnimationFrame(animate);
    }
    animate();
  }

  function drawGraphicCanvas() {
    const canvas = document.getElementById('canvas-graphic');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let time = 0;
    function animate() {
      // Mandala-inspired background
      const gradient = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.5, 0, canvas.width * 0.5, canvas.height * 0.5, canvas.width);
      gradient.addColorStop(0, '#1a1520');
      gradient.addColorStop(0.5, '#0f0a12');
      gradient.addColorStop(1, '#000');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rotating mandala patterns
      ctx.strokeStyle = 'rgba(201, 168, 76, 0.5)';
      ctx.lineWidth = 2;
      for (let r = 1; r < 8; r++) {
        ctx.beginPath();
        const radius = 50 * r + Math.sin(time * 0.002) * 30;
        ctx.arc(canvas.width * 0.5, canvas.height * 0.5, radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Rotating spokes
      ctx.strokeStyle = 'rgba(240, 208, 128, 0.4)';
      for (let i = 0; i < 12; i++) {
        const angle = (i * Math.PI / 6) + time * 0.002;
        const startX = canvas.width * 0.5;
        const startY = canvas.height * 0.5;
        const endX = startX + Math.cos(angle) * 300;
        const endY = startY + Math.sin(angle) * 300;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }

      // Center glow
      const centerGradient = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.5, 0, canvas.width * 0.5, canvas.height * 0.5, 100);
      centerGradient.addColorStop(0, 'rgba(240, 208, 128, 0.3)');
      centerGradient.addColorStop(1, 'rgba(240, 208, 128, 0)');
      ctx.fillStyle = centerGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      time++;
      requestAnimationFrame(animate);
    }
    animate();
  }

  // ═══════════════════════════════════════════════════════
  // KEYBOARD & TOUCH CONTROLS
  // ═══════════════════════════════════════════════════════
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'Enter') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  document.addEventListener('click', nextSlide);

  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => touchStartX = e.touches[0].clientX);
  document.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    if (touchStartX - touchEndX > 50) nextSlide();
    if (touchEndX - touchStartX > 50) prevSlide();
  });

  // ═══════════════════════════════════════════════════════
  // INITIALIZATION
  // ═══════════════════════════════════════════════════════
  window.addEventListener('load', () => {
    initCarousel('groom-carousel', 'groom-nav', true);
    initCarousel('bride-carousel', 'bride-nav', true);
    initCanvasFX(0);
  });

  window.addEventListener('resize', () => {
    initCanvasFX(currentSlide);
  });

  updateNav();
</script>

</body>
</html>
